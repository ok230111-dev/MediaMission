<!doctype html>
<html lang="{{ g.lang if g.lang else 'uk' }}">
  <head>
    <!-- ==========================================================
         ОСНОВНІ НАЛАШТУВАННЯ СТОРІНКИ
    =========================================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MediaMission ist eine interaktive Plattform zur Förderung der Medienkompetenz durch Medienmissionen, Video-Quizze und praktische Aufgaben."
    />

    <!-- Завантажуємо тему ЯКНАЙРАНІШЕ до рендеру контенту -->
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>

    <title>{% block title %} MediaMission {% endblock %}</title>

    <!-- FAVICON -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}"
    />
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='favicon/favicon.ico') }}"
      type="image/x-icon"
    />

    <!-- BOOTSTRAP CSS (лишено лише одне підключення) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- BOOTSTRAP ICONS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Swiper.js -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- ВЛАСНІ СТИЛІ (підключаються останніми) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <!--manifest, щоб додати сайт на головний екран мобільного пристрою -->
    <link
      rel="manifest"
      href="{{ url_for('static', filename='manifest.json') }}"
    />

    <!-- Google Site Verification -->
    <meta
      name="google-site-verification"
      content="wv096CnnJnKYDg_K9wXFEosMRoQIo3DtQi4JfezKsB4"
    />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="MediaMission" />

    <meta
      property="og:description"
      content="Improve your media literacy through interactive quizzes, fake news detection, practical challenges and engaging educational missions."
    />

    <meta
      property="og:image"
      content="https://mediamission.onrender.com/static/image/og-image.png"
    />

    <meta property="og:url" content="https://mediamission.onrender.com/" />

    <link
      rel="canonical"
      href="https://mediamission.onrender.com{{ request.path }}"
    />

    <meta name="robots" content="index, follow" />

    <meta name="author" content="Oksana Kucheruk" />

    <meta property="og:site_name" content="MediaMission" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="MediaMission" />

    <meta
      name="twitter:description"
      content="Interaktive Missionen zur Medienkompetenz"
    />

    <meta
      name="twitter:image"
      content="https://mediamission.onrender.com/static/image/og-image.png"
    />

    <meta name="twitter:url" content="https://mediamission.onrender.com/" />

    <!-- Покращує підтримку соцмиереж -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="MediaMission — Interaktive Plattform für Medienkompetenz"
    />

    <meta name="theme-color" content="#0d6efd" />

    <meta
      name="keywords"
      content="MediaMission, Zukunft Ukraine, DAAD, Oksana Kucheruk, Oleksandr Kucheruk, Medienkompetenz, Fake News, Medienbildung, Quiz, Lernen, Schule, Deutschland, Ukraine, interaktive Missionen, kritisches Denken, Medienanalyse, digitale Bildung, Online-Lernen, Medienkompetenz-Training, Medienkompetenz-Plattform, Medienkompetenz-Entwicklung, Medienkompetenz-Förderung, Medienkompetenz-Programme, Medienkompetenz-Workshops, Medienkompetenz-Kurse, Medienkompetenz-Schulungen"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="apple-mobile-web-app-title" content="MediaMission" />

    <meta property="og:locale" content="de_DE" />

    <meta property="og:type" content="website" />

    <!--Schema.org, щоб допомогти пошуковим системам краще розуміти контент сторінки -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MediaMission",
        "url": "https://mediamission.onrender.com",
        "description": "Interactive platform for media literacy",
        "publisher": {
          "@type": "Organization",
          "name": "MediaMission"
        }
      }
    </script>
  </head>

  <body
    data-t-hello="{{ t('hello') }}"
    data-t-learn-critical="{{ t('learn_critical_think') }}"
    data-t-learn="{{ t('learn') }}"
    data-t-critical="{{ t('critical_think') }}"
    data-t-admin-panel="{{ t('nav_admin_panel') }}"
    data-t-profile="{{ t('nav_profile') }}"
    data-t-home="{{ t('nav_home') }}"
    data-t-missions="{{ t('nav_missions') }}"
    data-t-logout="{{ t('nav_logout') }}"
    data-t-register="{{ t('nav_register') }}"
    data-t-login="{{ t('nav_login') }}"
    data-t-leaderboard="{{ t('nav_leaderboard') }}"
  >
    <!-- ==========================================================
         HEADER / NAVBAR
    =========================================================== -->
    <header class="site-header shadow-sm">
      <nav class="navbar navbar-expand-lg container py-3">
        <!-- 1. Логотип -->
        <a class="navbar-brand fw-bold" href="/">MediaMission</a>

        <!-- 2. Права частина: Перемикач мови + Тема (Завжди видимі) -->
        <div
          class="d-flex align-items-center gap-2 ms-lg-4 me-lg-auto order-lg-2"
        >
          <div class="language-switch">
            <a
              href="/set_language/uk"
              class="{% if g.lang=='uk' %}active{% endif %}"
              >ua</a
            >
            <a
              href="/set_language/de"
              class="{% if g.lang=='de' %}active{% endif %}"
              >de</a
            >
            <a
              href="/set_language/en"
              class="{% if g.lang=='en' %}active{% endif %}"
              >en</a
            >
          </div>

          <button
            class="btn btn-theme-toggle p-1"
            id="themeToggle"
            onclick="toggleTheme()"
          >
            <i class="bi bi-moon-fill" id="themeIcon"></i>
          </button>

          <!-- Гамбургер для мобілок -->
          <button
            class="navbar-toggler ms-auto"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <i class="bi bi-list fs-1"></i>
          </button>
        </div>

        <!-- 3. Основне меню (На десктопі йде ПІСЛЯ перемикача мови) -->
        <div class="collapse navbar-collapse order-lg-3" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="/">
                <i class="bi bi-house-door nav-icon"></i>
                <span>{{ t('nav_home') }}</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/missions-overview">
                <i class="bi bi-journal-check nav-icon"></i>
                <span>{{ t('nav_missions') }}</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/leaderboard">
                <i class="bi bi-trophy-fill nav-icon"></i>
                <span>{{ t('nav_leaderboard') }}</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/profile">
                <i class="bi bi-person-circle nav-icon"></i>
                <span>{{ t('nav_profile') }}</span>
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- ==========================================================
         MAIN CONTENT
    =========================================================== -->
    <main class="main-content">{% block content %} {% endblock %}</main>

    <!-- ==========================================================
         FOOTER
    =========================================================== -->
    <footer class="site-footer py-4 mt-auto">
      <div class="container text-center text-muted">
        <p class="mb-0">© 2026 MediaMission. Всі права захищено.</p>
      </div>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script
      type="module"
      src="{{ url_for('static', filename='js/authorized.js') }}"
    ></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  </body>
</html>
