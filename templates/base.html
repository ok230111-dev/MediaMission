<!doctype html>
<html lang="{{ g.lang if g.lang else 'uk' }}">
  <head>
    <!-- ==========================================================
         ОСНОВНІ НАЛАШТУВАННЯ СТОРІНКИ
    =========================================================== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Завантажуємо тему ЯКНАЙРАНІШЕ до рендеру контенту -->
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>

    <title>{% block title %} MediaMission {% endblock %}</title>

    <!-- FAVICON -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}"
    />
    <link
      rel="manifest"
      href="{{ url_for('static', filename='favicon/site.webmanifest') }}"
    />
    <link
      rel="shortcut icon"
      href="{{ url_for('static', filename='favicon/favicon.ico') }}"
      type="image/x-icon"
    />

    <!-- BOOTSTRAP CSS (лишено лише одне підключення) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- BOOTSTRAP ICONS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Swiper.js -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <!-- ВЛАСНІ СТИЛІ (підключаються останніми) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body
    data-t-hello="{{ t('hello') }}"
    data-t-learn-critical="{{ t('learn_critical_think') }}"
    data-t-learn="{{ t('learn') }}"
    data-t-critical="{{ t('critical_think') }}"
    data-t-admin-panel="{{ t('nav_admin_panel') }}"
    data-t-profile="{{ t('nav_profile') }}"
    data-t-home="{{ t('nav_home') }}"
    data-t-missions="{{ t('nav_missions') }}"
    data-t-logout="{{ t('nav_logout') }}"
    data-t-register="{{ t('nav_register') }}"
    data-t-login="{{ t('nav_login') }}"
    data-t-leaderboard="{{ t('nav_leaderboard') }}"
  >
    <!-- ==========================================================
         HEADER / NAVBAR
    =========================================================== -->
    <header class="site-header shadow-sm">
      <nav class="navbar navbar-expand-lg container py-3">
        <a class="navbar-brand fw-bold" href="/">MediaMission</a>

        <div class="d-flex align-items-center ms-auto order-lg-last gap-2">
          <!-- Перемикач мови -->
          <div class="language-switch me-2">
            <a
              href="/set_language/uk"
              class="{% if g.lang=='uk' %}active{% endif %}"
              >ua</a
            >
            <a
              href="/set_language/de"
              class="{% if g.lang=='de' %}active{% endif %}"
              >de</a
            >
            <a
              href="/set_language/en"
              class="{% if g.lang=='en' %}active{% endif %}"
              >en</a
            >
          </div>

          <!-- Перемикач теми -->
          <button
            class="btn btn-theme-toggle p-1"
            id="themeToggle"
            onclick="toggleTheme()"
            aria-label="Toggle theme"
          >
            <i class="bi bi-moon-fill" id="themeIcon"></i>
          </button>

          <!-- Кнопка мобільного меню -->
          <button
            class="navbar-toggler ms-2"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul
            class="navbar-nav ms-auto align-items-lg-center gap-lg-3 mt-3 mt-lg-0"
          >
            <li class="nav-item">
              <a class="nav-link" href="/">
                <i class="bi bi-house-door me-1"></i>
                {{ t('nav_home') }}
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/missions-overview">
                <i class="bi bi-journal-check me-1"></i>
                {{ t('nav_missions') }}
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/leaderboard">
                <i class="bi bi-trophy-fill me-1"></i>
                {{ t('nav_leaderboard') }}
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/profile">
                <i class="bi bi-person-circle me-1"></i>
                {{ t('nav_profile') }}
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- ==========================================================
         MAIN CONTENT
    =========================================================== -->
    <main class="main-content">{% block content %} {% endblock %}</main>

    <!-- ==========================================================
         FOOTER
    =========================================================== -->
    <footer class="site-footer py-4 mt-auto">
      <div class="container text-center text-muted">
        <p class="mb-0">© 2026 MediaMission. Всі права захищено.</p>
      </div>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script
      type="module"
      src="{{ url_for('static', filename='js/authorized.js') }}"
    ></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  </body>
</html>
