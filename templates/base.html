<!doctype html>
<html lang="uk">
  <head>
    <!-- ==========================================================
         ОСНОВНІ НАЛАШТУВАННЯ СТОРІНКИ
    =========================================================== -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Завантажуємо тему ЯКНАЙРАНІШЕ, до рендеру видимого контенту -->
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme") || "light";
        document.documentElement.setAttribute("data-theme", savedTheme);
      })();
    </script>

    <!--
        Кожна сторінка може встановлювати власний title.
        Якщо не встановлено - використовується "MediaMission".
    -->
    <title>{% block title %} MediaMission {% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- ==========================================================
         BOOTSTRAP CSS
         Готові стилі та компоненти (navbar, buttons, grid...)
    =========================================================== -->

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- ==========================================================
         BOOTSTRAP ICONS
         Бібліотека іконок
    =========================================================== -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- ==========================================================
         GOOGLE FONTS
         Основний шрифт сайту
    =========================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ==========================================================
         ВЛАСНІ СТИЛІ
         Підключаються після Bootstrap,
         щоб можна було перевизначати його стилі.
    =========================================================== -->

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <!-- Swiper.js -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>

  <body
    data-t-hello="{{ t('hello') }}"
    data-t-learn-critical="{{ t('learn_critical_think') }}"
    data-t-learn="{{ t('learn') }}"
    data-t-critical="{{ t('critical_think') }}"
    data-t-admin-panel="{{ t('nav_admin_panel') }}"
    data-t-profile="{{ t('nav_profile') }}"
    data-t-home="{{ t('nav_home') }}"
    data-t-missions="{{ t('nav_missions') }}"
    data-t-logout="{{ t('nav_logout') }}"
    data-t-register="{{ t('nav_register') }}"
    data-t-login="{{ t('nav_login') }}"
    data-t-leaderboard="{{ t('nav_leaderboard') }}"
  >
    <!-- ==========================================================
         HEADER / NAVBAR
         Верхня навігаційна панель сайту
    =========================================================== -->

    <header class="site-header shadow-sm">
      <nav class="navbar navbar-expand-lg container py-3">
        <a class="navbar-brand fw-bold" href="/"> MediaMission </a>

        <div class="d-flex align-items-center ms-auto">
          <div class="language-switch me-3">
            <a
              href="/set_language/uk"
              class="{% if g.lang=='uk' %}active{% endif %}"
            >
              ua
            </a>
            <a
              href="/set_language/de"
              class="{% if g.lang=='de' %}active{% endif %}"
            >
              de
            </a>
            <a
              href="/set_language/en"
              class="{% if g.lang=='en' %}active{% endif %}"
            >
              en
            </a>
          </div>

          <!-- В навігації, поруч з вибором мови -->
          <li class="nav-item">
            <button
              class="nav-link btn btn-link"
              id="themeToggle"
              onclick="toggleTheme()"
            >
              <i class="bi bi-moon-fill" id="themeIcon"></i>
            </button>
          </li>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">
            <li class="nav-item">
              <a class="nav-link" href="/profile">
                <i class="bi bi-person-circle"></i>
                {{ t('nav_profile') }}
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/leaderboard">
                <i class="bi bi-trophy-fill"></i>
                {{ t('nav_leaderboard') }}
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/">
                <i class="bi bi-house-door"></i>
                {{ t('nav_home') }}
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/missions-overview">
                <i class="bi bi-journal-check"></i>
                {{ t('nav_missions') }}
              </a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <!-- ==========================================================
         MAIN
         Основний контейнер.
         Тут Flask підставляє контент інших сторінок.
    =========================================================== -->

    <main>{% block content %} {% endblock %}</main>

    <!-- ==========================================================
         FOOTER

    <footer class="footer">
      <div class="container">
        <p>© 2026 MediaMission</p>
      </div>
    </footer>

  =========================================================== -->

    <!-- ==========================================================
         BOOTSTRAP JAVASCRIPT
         Потрібний для dropdown, navbar,
         модальних вікон тощо.
    =========================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script
      type="module"
      src="{{ url_for('static', filename='js/authorized.js') }}"
    ></script>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
