{% extends "base.html" %} {% block title %}{{t('login_mediamission_title')}}{%
endblock %} {% block content %}
<section
  class="container py-5 d-flex justify-content-center align-items-center"
  style="min-height: 70vh"
>
  <div
    class="card shadow-sm border-0 p-4"
    style="
      max-width: 420px;
      width: 100%;
      border-radius: var(--radius-large, 16px);
    "
  >
    <div class="text-center mb-4">
      <i class="bi bi-box-arrow-in-right display-4 text-primary"></i>
      <h2 class="fw-bold mt-2">{{t('login_system')}}</h2>
      <p class="text-muted small">{{t('login_system_text')}}</p>
    </div>

    <!-- Блок для виводу повідомлень про помилки/успіх -->
    <div id="authAlert" class="alert d-none" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">{{t('email')}}</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="name@example.com"
            required
          />
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">{{t('password')}}</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder=""
            required
          />
        </div>
      </div>

      <button
        type="submit"
        id="loginBtn"
        class="btn btn-primary w-100 py-2 fw-bold"
        style="border-radius: 12px"
      >
        {{t('nav_login')}}
      </button>
    </form>

    <div class="text-center mt-4">
      <small class="text-muted"
        >{{t('no_account')}}
        <a href="/register" class="text-primary text-decoration-none fw-bold"
          >{{t('login_register')}}</a
        ></small
      >
    </div>

    <button
      id="googleBtn"
      class="btn btn-outline-dark w-100 mt-3 d-flex align-items-center justify-content-center gap-2"
    >
      <i class="bi bi-google"></i>
      {{t('login_google')}}
    </button>
  </div>
</section>

<script
  type="module"
  src="{{ url_for('static', filename='js/login.js') }}"
></script>
<script
  type="module"
  src="{{ url_for('static', filename='js/google-login.js') }}"
></script>
{% endblock %}
