<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />

    <title>Offline</title>

    <style>
      body {
        font-family: Arial;

        display: flex;

        justify-content: center;

        align-items: center;

        height: 100vh;

        background: #f4f7fb;

        text-align: center;
      }

      .card {
        background: white;

        padding: 40px;

        border-radius: 20px;

        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);

        max-width: 500px;
      }

      h1 {
        font-size: 32px;
      }

      p {
        color: #666;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>📡</h1>

      <h2>{{t('no_connection_internet')}}</h2>

      <p>{{t('no_internet_try_again')}}</p>
      <button onclick="location.reload()" class="btn btn-primary">
        <i class="bi bi-arrow-repeat"></i> Оновити
      </button>
    </div>
  </body>
</html>
